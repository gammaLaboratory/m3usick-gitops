apiVersion: apps/v1
kind: Deployment
metadata:
  name: m3usick-web
  labels:
    app.kubernetes.io/name: m3usick
    app.kubernetes.io/component: web
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: m3usick
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: m3usick
        app.kubernetes.io/component: web
    spec:
      restartPolicy: Always
      imagePullSecrets:
        - name: ecr-secret
      containers:
        - name: web
          image: m3usick-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: HTTP_ADDR
              value: :8080
            - name: WEB_DIST_DIR
              value: /app/web/dist
            - name: APP_ENV
              value: development
            - name: AWS_REGION
              value: ap-northeast-1
            - name: M3USICK_AUTH_TABLE
              value: m3usick-auth-dev
            - name: AUTH_TOKEN_PEPPER
              valueFrom:
                secretKeyRef:
                  name: m3usick-env
                  key: AUTH_SECRET
            - name: SESSION_COOKIE_NAME
              value: m3usick_session
            - name: CSRF_COOKIE_NAME
              value: m3usick_csrf
            - name: ALLOWED_ORIGINS
              value: https://dev.m3usick.com
            - name: SESSION_TTL_HOURS
              value: "8760"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: m3usick-env
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: m3usick-env
                  key: AWS_SECRET_ACCESS_KEY
          readinessProbe:
            httpGet:
              path: /api/v1/healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /api/v1/healthz
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
